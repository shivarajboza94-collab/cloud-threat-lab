id: b2b-invoice-idor-audit

info:
  name: Missing Tenant Isolation on Invoice API
  author: security-team
  severity: high
  description: Verifies whether the invoice retrieval endpoint enforces multi-tenant boundary checks.
  reference:
    - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
  tags: idor,bola,api,auth

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/v1/invoices/inv-101"

    headers:
      X-Tenant-ID: "tenant-b"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - '"tenant_id": "tenant-a"'
          - '"amount":'
        condition: and
        part: body
